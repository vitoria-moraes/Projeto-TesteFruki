server.port=8081

# ---------------------------------------------------------------------------
# OpenWeatherMap (protótipo)
# Em produção: definir OPENWEATHER_API_KEY no ambiente e rotacionar a chave.
# ---------------------------------------------------------------------------
openweather.api-key=${OPENWEATHER_API_KEY:}
openweather.base-url=https://api.openweathermap.org/data/2.5/weather
openweather.timeout-ms=1500
openweather.cache-minutes=10
openweather.fallback-temperatura=24.0

